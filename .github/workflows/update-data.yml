name: Update LLE Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Update LLE Data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          mkdir -p data

          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          import os

          data = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "followers": "1.91M+",
              "kick_online": False,
              "kick_status": "غير متصل حالياً",
              "latest_video": {
                  "title": "",
                  "url": "",
                  "thumbnail": ""
              },
              "latest_stream": {
                  "title": "",
                  "url": "https://kick.com/lle"
              }
          }

          # =========================================================
          # YOUTUBE - SUBSCRIBERS
          # =========================================================

          try:
              api_key = os.environ.get("YOUTUBE_API_KEY")

              if api_key:
                  params = urllib.parse.urlencode({
                      "part": "statistics",
                      "id": "UCgGYPnVJytkr6sVNLQ-l0zQ",
                      "key": api_key
                  })

                  youtube_api_url = (
                      "https://www.googleapis.com/youtube/v3/channels?"
                      + params
                  )

                  request = urllib.request.Request(
                      youtube_api_url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  response = urllib.request.urlopen(
                      request,
                      timeout=15
                  )

                  result = json.loads(
                      response.read().decode("utf-8")
                  )

                  items = result.get("items", [])

                  if items:
                      subscribers = items[0]["statistics"].get(
                          "subscriberCount"
                      )

                      if subscribers:
                          subscribers = int(subscribers)

                          if subscribers >= 1000000:
                              data["followers"] = (
                                  f"{subscribers / 1000000:.2f}M+"
                              )
                          elif subscribers >= 1000:
                              data["followers"] = (
                                  f"{subscribers / 1000:.1f}K+"
                              )
                          else:
                              data["followers"] = str(subscribers)

                          print(
                              "YouTube subscribers:",
                              data["followers"]
                          )

              else:
                  print("YOUTUBE_API_KEY is missing")

          except Exception as e:
              print("YouTube API update failed:", e)

          # =========================================================
          # KICK - LIVE STATUS
          # =========================================================

          try:
              kick_url = "https://kick.com/api/v2/channels/lle"

              request = urllib.request.Request(
                  kick_url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json"
                  }
              )

              response = urllib.request.urlopen(
                  request,
                  timeout=15
              )

              kick = json.loads(
                  response.read().decode("utf-8")
              )

              livestream = kick.get("livestream")

              if livestream:
                  is_live = livestream.get("is_live", False)

                  data["kick_online"] = bool(is_live)

                  if is_live:
                      data["kick_status"] = "متصل الآن"

                      title = (
                          livestream.get("session_title")
                          or livestream.get("title")
                          or "بث مباشر الآن"
                      )

                      data["latest_stream"] = {
                          "title": title,
                          "url": "https://kick.com/lle"
                      }

                  else:
                      data["kick_status"] = "غير متصل حالياً"

              else:
                  data["kick_online"] = False
                  data["kick_status"] = "غير متصل حالياً"

              print("Kick updated successfully")

          except Exception as e:
              print("Kick update failed:", e)

          # =========================================================
          # YOUTUBE - LATEST VIDEO
          # =========================================================

          try:
              youtube_url = (
                  "https://www.youtube.com/feeds/videos.xml?"
                  "channel_id=UCgGYPnVJytkr6sVNLQ-l0zQ"
              )

              request = urllib.request.Request(
                  youtube_url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              xml_data = urllib.request.urlopen(
                  request,
                  timeout=15
              ).read()

              root = ET.fromstring(xml_data)

              ns = {
                  "atom": "http://www.w3.org/2005/Atom",
                  "yt": "http://www.youtube.com/xml/schemas/2015"
              }

              entry = root.find("atom:entry", ns)

              if entry is not None:

                  title = entry.find("atom:title", ns)
                  video_id = entry.find("yt:videoId", ns)

                  if (
                      title is not None
                      and video_id is not None
                      and title.text
                      and video_id.text
                  ):

                      video_id_text = video_id.text

                      data["latest_video"] = {
                          "title": title.text,
                          "url": (
                              "https://www.youtube.com/watch?v="
                              + video_id_text
                          ),
                          "thumbnail": (
                              "https://i.ytimg.com/vi/"
                              + video_id_text
                              + "/maxresdefault.jpg"
                          )
                      }

                      print(
                          "Latest YouTube video:",
                          title.text
                      )

          except Exception as e:
              print("YouTube RSS update failed:", e)

          # =========================================================
          # SAVE DATA
          # =========================================================

          with open(
              "data/lle-data.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              )
          )

          PY

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/lle-data.json

          git diff --cached --quiet || git commit -m "Update LLE data"

          git push
